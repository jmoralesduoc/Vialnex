<text x="84" y="834" font-family="Verdana,DejaVu Sans,sans-serif" font-size="12.5" font-weight="bold" fill="#13303a">Qué muestra este modelo</text>
<text x="84" y="852" font-family="Verdana,DejaVu Sans,sans-serif" font-size="12" fill="#5b6f77">Las entidades del negocio y cómo se vinculan, sin claves foráneas ni tipos de dato: eso pertenece al modelo lógico.</text>
<text x="84" y="878" font-family="Verdana,DejaVu Sans,sans-serif" font-size="12.5" font-weight="bold" fill="#13303a">Vínculo de muchos a muchos</text>
<text x="84" y="896" font-family="Verdana,DejaVu Sans,sans-serif" font-size="12" fill="#5b6f77">USUARIO desempeña ROL es N:M. Al llevarlo a tablas aparece una tabla puente, que es consecuencia del diseño físico y no</text>
